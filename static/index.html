<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>本地知识库问答</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;margin:0;padding:0;background:#f5f5f5;}
    #chat-container{max-width:700px;margin:40px auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;flex-direction:column;height:80vh;}
    #header{background:#007bff;color:#fff;padding:15px;text-align:center;font-size:18px;}
    #messages{flex:1;padding:15px;overflow-y:auto;}
    .msg{margin-bottom:12px;display:flex;align-items:flex-start;}
    .msg.user{justify-content:flex-end;}
    .msg.bot{justify-content:flex-start;}
    .bubble{
      max-width:70%;
      padding:10px 14px;
      border-radius:8px;
      line-height:1.6;          /* 行距更舒服 */
      font-size:14px;
      white-space:pre-wrap;     /* 保留 \n 和空格 */
      word-break:break-word;    /* 长单词断开 */
    }
    .msg.user .bubble{background:#007bff;color:#fff;}
    .msg.bot .bubble{background:#e9eceba6;color:#212529;}
    #input-area{display:flex;padding:10px;border-top:1px solid #dee2e6;}
    #input{flex:1;padding:10px;border:1px solid #ced4da;border-radius:4px;font-size:14px;}
    #send-btn{margin-left:10px;padding:10px 18px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;}
    #send-btn:disabled{background:#6c757d;cursor:not-allowed;}
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="header">中医知识库大模型</div>
    <div id="messages"></div>
    <div id="input-area">
      <input id="input" type="text" placeholder="输入问题，回车发送" />
      <button id="send-btn">发送</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('input');
    const sendBtn    = document.getElementById('send-btn');
    const userId     = localStorage.getItem('uid') || 'u' + Date.now();
    localStorage.setItem('uid', userId);

    let history = [];

    function renderMsg(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      // 把 \n 转成 <br>，同时去掉首尾多余空行
      bubble.innerHTML = text.trim().replace(/\n/g, '<br>');
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function askQuestion(question) {
      sendBtn.disabled = true;
      renderMsg(question, 'user');
      inputEl.value = '';

      try {
        const res = await fetch('/api/qa', {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({
            user_id: userId,
            query  : question,
            history: history
          })
        });

        if (!res.ok) throw new Error('网络错误 ' + res.status);
        const data = await res.json();
        if (data.code !== 200) throw new Error(data.msg || '服务器错误');

        const answer = data.data.answer;
        renderMsg(answer, 'bot');
        history = data.data.history.slice(-20);   // 保留最近 20 条
      } catch (err) {
        renderMsg('抱歉，暂时无法回答问题：' + err.message, 'bot');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', () => {
      const q = inputEl.value.trim();
      if (q) askQuestion(q);
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const q = inputEl.value.trim();
        if (q) askQuestion(q);
      }
    });
  </script>
</body>
</html>
